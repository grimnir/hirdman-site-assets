<style>body,#allrecords{background:#030807 !important}</style>
<meta property="og:image" content="https://grimnir.github.io/hirdman-site-assets/og/about.png?v=2">

<style>
.hirdman .kicker{display:block;font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.hirdman .kicker::before{content:none}
.hirdman .label,.hirdman .feed-h,.hirdman .plan .name{letter-spacing:0;text-transform:none}
.hirdman .label{font-size:14px;color:var(--muted)}
.hirdman .plan .name{font-size:15px;color:var(--ink)}
.hirdman .card::before{content:none}
.hirdman .card:hover{border-color:var(--teal-line);box-shadow:none}
.hirdman .btn{box-shadow:none}
.hirdman .btn:hover{transform:none;box-shadow:none}
.hirdman .cta{background:var(--bg-2)}
#main::before{content:none;display:none}
.hirdman .trust li::before{content:"\00b7";width:auto;height:auto;background:none;-webkit-mask:none;mask:none;color:var(--muted)}
.hirdman .more{min-height:44px}
.hirdman .btn.sm{height:44px}
.hirdman .top .wrap > a[href="/noslop"]{display:inline-flex;align-items:center;min-height:44px}
.hirdman .foot .ns-foot-h{margin:0 0 12px;max-width:none;font-size:13px;line-height:1.4;font-weight:700;letter-spacing:0;color:var(--muted)}
.hirdman .faq details{padding:6px 0}
.hirdman .faq summary{min-height:48px;padding-block:8px}
.hirdman .faq details p:last-child{margin-bottom:14px}
.hirdman .burger{width:auto;min-width:44px;padding:0 12px;grid-auto-flow:column;gap:8px;align-items:center}
.hirdman .ns-menu-t{font-size:14px;font-weight:600}
@media (max-width:720px){.hirdman a.side-tab{display:none}}
@media (max-width:640px){
.hirdman .top-cta .btn{height:44px}
.hirdman .nav.open{gap:2px}
.hirdman .nav.open a:not(.btn){padding-block:10px}
.hirdman .foot ul{gap:0}
.hirdman .foot li a{display:inline-block;padding-block:12px}
}
.hirdman .crumbs .ns-here{margin:0}
.hirdman .crumbs a{display:inline-block;padding-block:14px;margin-block:-14px}
.hirdman .trust a{display:inline-block;padding-block:3px;margin-block:-3px}
.hirdman .more:hover svg{transform:none}
.hirdman .ns-who{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:40px 64px;align-items:start}
.hirdman .ns-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 32px;margin:0;padding:22px 0 0;border-top:1px solid var(--teal-line)}
.hirdman .ns-facts div{min-width:0}
.hirdman .ns-facts dt{font-size:clamp(26px,2.4vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.hirdman .ns-facts dd{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--muted)}
.hirdman .ns-rows{border-top:1px solid var(--teal-line)}
.hirdman .ns-row{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:6px 56px;padding:24px 0;border-bottom:1px solid rgba(23,241,215,.12)}
.hirdman .ns-row h3{margin:0;font-size:20px}
.hirdman .ns-row p{margin:0;max-width:62ch;font-size:16px;line-height:1.55;color:var(--muted)}
.hirdman .ns-partners{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 56px;align-items:start}
.hirdman .ns-links{border-top:1px solid var(--teal-line)}
.hirdman .ns-links > div{padding:20px 0;border-bottom:1px solid rgba(23,241,215,.12)}
.hirdman .ns-partners .label{margin:0}
.hirdman .ns-partners h3{margin:2px 0 6px}
.hirdman .ns-links h3 a{display:inline-block;padding-block:10px;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.hirdman .ns-links p:last-child{margin:0;max-width:56ch;font-size:15px;color:var(--muted)}
.hirdman .ns-program h3{margin:6px 0 0}
.hirdman .ns-program ul{margin:16px 0 0;padding:0 0 0 20px;display:grid;gap:8px;font-size:16px;line-height:1.5}
.hirdman .ns-reach{list-style:none;margin:0;padding:0;border-top:1px solid var(--teal-line)}
.hirdman .ns-reach li{border-bottom:1px solid rgba(23,241,215,.12)}
.hirdman .ns-reach .more{min-height:56px}
@media (min-width:641px){.hirdman .foot ul{gap:0}.hirdman .foot li a{display:inline-block;padding-block:4px}}
@media (max-width:900px){.hirdman .ns-who,.hirdman .ns-partners{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.hirdman .ns-row{grid-template-columns:minmax(0,1fr)}.hirdman .trust a{padding-block:13px;margin-block:-13px}}
</style>
