<style>
.hirdman .kicker{display:block;font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.hirdman .kicker::before{content:none}
.hirdman .label,.hirdman .feed-h,.hirdman .plan .name{letter-spacing:0;text-transform:none}
.hirdman .label{font-size:14px;color:var(--muted)}
.hirdman .plan .name{font-size:15px;color:var(--ink)}
.hirdman .card::before{content:none}
.hirdman .card:hover{border-color:var(--teal-line);box-shadow:none}
.hirdman .btn{box-shadow:none}
.hirdman .btn:hover{transform:none;box-shadow:none}
.hirdman .cta{background:var(--bg-2)}
#main::before{content:none;display:none}
.hirdman .trust li::before{content:"\00b7";width:auto;height:auto;background:none;-webkit-mask:none;mask:none;color:var(--muted)}
.hirdman .more{min-height:44px}
.hirdman .btn.sm{height:44px}
.hirdman .top .wrap > a[href="/"]{display:inline-flex;align-items:center;min-height:44px}
.hirdman .foot .ns-foot-h{margin:0 0 12px;max-width:none;font-size:13px;line-height:1.4;font-weight:700;letter-spacing:0;color:var(--muted)}
.hirdman .faq details{padding:6px 0}
.hirdman .faq summary{min-height:48px;padding-block:8px}
.hirdman .faq details p:last-child{margin-bottom:14px}
.hirdman .burger{width:auto;min-width:44px;padding:0 12px;grid-auto-flow:column;gap:8px;align-items:center}
.hirdman .ns-menu-t{font-size:14px;font-weight:600}
@media (max-width:720px){.hirdman a.side-tab{display:none}}
@media (max-width:640px){
.hirdman .top-cta .btn{height:44px}
.hirdman .nav.open{gap:2px}
.hirdman .nav.open a:not(.btn){padding-block:10px}
.hirdman .foot ul{gap:0}
.hirdman .foot li a{display:inline-block;padding-block:12px}
}
.hirdman .page-hero{padding-bottom:32px}
.hirdman .page-hero h1{font-size:clamp(36px,5vw,64px)}
.hirdman section.ns-doc{padding-top:24px}
.hirdman .crumbs a{display:inline-flex;align-items:center;min-height:24px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hirdman .ns-gl-index{margin:0 0 48px;padding-top:14px;border-top:1px solid var(--teal-line)}
.hirdman .ns-gl-index ul{list-style:none;margin:0;padding:0;columns:4 200px;column-gap:32px}
.hirdman .ns-gl-index li{break-inside:avoid}
.hirdman .ns-gl-index a{display:inline-block;padding:4px 0;font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hirdman .ns-gl-index a:hover{color:var(--teal)}
.hirdman .ns-gl{margin:0;border-top:1px solid var(--teal-line)}
.hirdman .ns-gl > div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:6px 40px;padding:22px 0;border-bottom:1px solid rgba(23,241,215,.12)}
.hirdman .ns-gl dt{margin:0;font-size:19px;font-weight:700;line-height:1.35}
.hirdman .ns-gl dt a{display:inline-block;color:var(--ink)}
.hirdman .ns-gl dt a:hover{color:var(--teal);text-decoration:underline;text-underline-offset:4px}
.hirdman .ns-gl dd{margin:0;max-width:68ch;font-size:16px;line-height:1.6;color:var(--muted)}
.hirdman .ns-gl dd a,.hirdman .ns-gl-more a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hirdman .ns-gl-more{margin:28px 0 0;font-size:15px;color:var(--muted)}
.hirdman .ns-cta-side{gap:14px;align-content:start}
.hirdman .ns-cta-side .btn{justify-self:start}
.hirdman .ns-mail{display:inline-flex;align-items:center;gap:10px;justify-self:start;min-height:44px;font-size:17px;font-weight:600;color:var(--ink)}
.hirdman .ns-mail svg{width:20px;height:20px;color:var(--teal);flex:none}
.hirdman .ns-mail:hover{text-decoration:underline;text-underline-offset:4px}
@media (min-width:641px){
.hirdman .foot ul{gap:0}
.hirdman .foot li a{display:inline-block;padding-block:4px}
.hirdman .trust a{display:inline-block;padding-block:3px}
}
@media (max-width:760px){.hirdman .ns-gl > div{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
.hirdman .crumbs a{min-height:44px}
.hirdman .ns-gl-index ul{columns:2;column-gap:20px}
.hirdman .ns-gl-index a{display:flex;align-items:center;min-height:44px;padding:0}
.hirdman .ns-gl > div{padding:16px 0}
.hirdman .ns-gl dt a{display:inline-flex;align-items:center;min-height:44px}
}
</style>

<style>
.hirdman h1,.hirdman h2:not(.ns-foot-h){font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.012em}
.hirdman h1{font-size:clamp(38px,5vw,64px);line-height:1.06;max-width:24ch}
.hirdman h2{font-size:clamp(28px,3.4vw,44px);line-height:1.1;max-width:24ch}
.hirdman{--muted:#b3c0bd;--muted-2:#8a9a97}
.hirdman p,.hirdman li,.hirdman dd{font-size:16px}
.hirdman .lead{font-size:clamp(17px,1.5vw,19px)}
.hirdman .kicker{display:none}
.hirdman .case,.hirdman .bignum{background:none;border:0;border-radius:0;padding:0}
.hirdman .bignum{border-left:1px solid var(--teal-line);padding-left:32px}
.hirdman .calc-report{background:none;border:0;border-top:1px solid var(--teal-line);border-radius:0;padding:14px 0 0}
.hirdman .cta{background:none;border:0;border-top:1px solid var(--teal-line);border-radius:0;padding:56px 0 0}
.hirdman .hp-plain{max-width:62ch;margin:28px 0 0;color:var(--muted)}
.hirdman .hp-foot{display:flex;flex-wrap:wrap;gap:4px 22px;margin:20px 0 0;padding:0;list-style:none}
.hirdman .hp-foot li{font-size:14px}
.hirdman .hp-foot a{display:inline-block;padding-block:12px;color:var(--muted)}
.hirdman .calc-report a{display:inline-block;padding-block:12px}
.hirdman .hp-foot a:hover{color:var(--ink)}
.hirdman footer .hp-about{max-width:60ch;color:var(--muted-2);font-size:14px;margin:12px 0 0}
.hirdman .hp-quote{margin:40px 0;padding:4px 0 4px 24px;border-left:2px solid var(--teal);max-width:34ch}
.hirdman .hp-quote blockquote{margin:0}
.hirdman .hp-quote p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:clamp(21px,2.2vw,26px);line-height:1.35;color:var(--ink)}
.hirdman .hp-quote figcaption{margin-top:12px;font-size:14px;color:var(--muted-2)}
@media (min-width:1100px){.hirdman .hp-quote.side{float:right;width:34ch;margin:0 0 24px 48px}}
@media (max-width:720px){.hirdman .bignum{border-left:0;padding-left:0;border-top:1px solid var(--teal-line);padding-top:20px}}
.hirdman .crumbs .ns-here{margin:0}
.hirdman section.ns-doc{padding-bottom:40px}
</style>
