<!-- Hirdman header for Tilda header pages (Header 88625876, Header Library 91823756), 08.11.
Same look and links as the new site's header. Self-contained: styles live under .hm-hdr only, so the
pages it sits on keep their own look. Colours carry !important: post pages paint every link cyan, which hid
the Free check label on its cyan button. No site.js here: it would retarget every link on the page. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
.hm-hdr{--ink:#eafffb;--muted:#9edbd4;--teal:#17F1D7;--teal-ink:#03201b;--teal-line:rgba(23,241,215,.2);--teal-soft:rgba(23,241,215,.08);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hm-hdr *{box-sizing:border-box}
.hm-hdr .hm-top{position:fixed;top:0;left:0;right:0;z-index:9990;height:72px;display:flex;align-items:center;background:rgba(3,8,7,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(23,241,215,.12)}
.hm-hdr .hm-wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.hm-hdr .hm-home{display:block;line-height:0}
.hm-hdr .hm-logo{height:26px;width:auto;color:var(--ink);display:block}
.hm-hdr .hm-nav{display:flex;gap:22px;font-size:14px;font-weight:600;align-items:center;white-space:nowrap}
.hm-hdr .hm-nav a{color:var(--muted)!important;text-decoration:none!important;font-family:inherit!important;transition:color .25s}
.hm-hdr .hm-nav a:hover{color:var(--ink)!important}
.hm-hdr .hm-nav a.active{color:var(--teal)!important}
.hm-hdr .hm-cta{display:flex;gap:10px;align-items:center}
.hm-hdr .hm-btn{display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none!important;font-family:inherit!important;color:var(--teal-ink)!important;background:var(--teal)!important;border:0;transition:background .25s}
.hm-hdr .hm-btn:hover{background:#14d9c1!important}
.hm-hdr .hm-btn.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--teal-line)}
.hm-hdr .hm-btn.ghost:hover{border-color:var(--teal);background:var(--teal-soft)!important}
.hm-hdr a:focus-visible,.hm-hdr button:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:6px}
.hm-hdr .hm-burger{display:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--teal-line);background:transparent;color:var(--ink);place-items:center;cursor:pointer;padding:0}
.hm-hdr .hm-burger svg{width:22px;height:22px}
.hm-hdr .hm-space{height:72px}
@media (max-width:1100px){
  .hm-hdr .hm-nav{display:none}
  .hm-hdr .hm-nav.open{display:flex;flex-direction:column;align-items:flex-start;position:fixed;top:72px;left:0;right:0;padding:20px 24px 24px;gap:18px;background:#040b0a;border-bottom:1px solid var(--teal-line);font-size:16px;white-space:normal}
  .hm-hdr .hm-burger{display:grid}
}
@media (max-width:640px){
  .hm-hdr .hm-top{height:64px} .hm-hdr .hm-space{height:64px} .hm-hdr .hm-nav.open{top:64px}
  .hm-hdr .hm-wrap{padding:0 16px}
  .hm-hdr .hm-btn.ghost{display:none}
  .hm-hdr .hm-btn{height:38px;padding:0 14px;font-size:13px}
  .hm-hdr .hm-logo{height:22px}
}
</style>

<script>
(function(){
  var nav=document.getElementById('hm-nav'),btn=document.getElementById('hm-burger');
  if(/^\/techlibrary/.test(location.pathname)){var l=nav.querySelector('[data-lib]');l.classList.add('active');l.setAttribute('aria-current','page');}
  btn.addEventListener('click',function(){var o=nav.classList.toggle('open');btn.setAttribute('aria-expanded',String(o));});
